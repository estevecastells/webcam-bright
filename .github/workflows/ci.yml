name: CI

# Every job here must be green before a pull request is reviewed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift (build, checks, app bundle)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build every target and run the checks
        working-directory: app
        run: |
          swift build -c debug
          swift run -c debug KitChecks
      - name: Build the app bundle
        run: scripts/build-app.sh
      - name: Smoke-test the app binary
        run: |
          out="$(build/WebcamBright.app/Contents/MacOS/WebcamBright --measure /nonexistent.jpg || true)"
          test "$out" = "cannot read /nonexistent.jpg"
          plutil -lint build/WebcamBright.app/Contents/Info.plist
          codesign --verify --deep --strict build/WebcamBright.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WebcamBright-app
          path: build/WebcamBright.app
          retention-days: 14

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
