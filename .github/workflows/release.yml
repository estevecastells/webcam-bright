name: Release

# Push a tag matching VERSION (for example v0.2.0) to build, sign and publish the app.
# See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

# Building only reads; publishing writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match VERSION v$version" >&2
            exit 1
          fi
      - name: Checks
        run: (cd app && swift run -c debug KitChecks)
      # Built without any secret. The app is ad-hoc signed here and gets its release signature
      # in the sign job.
      - name: Package
        env:
          WEBCAMBRIGHT_SIGN_IDENTITY: "-"
        run: scripts/package-release.sh
      - name: Smoke-test the package
        run: |
          mkdir -p /tmp/smoke && ditto -x -k dist/WebcamBright-macos-arm64.zip /tmp/smoke
          out="$(/tmp/smoke/WebcamBright.app/Contents/MacOS/WebcamBright --measure /nonexistent.jpg || true)"
          test "$out" = "cannot read /nonexistent.jpg"
          test -x /tmp/smoke/WebcamBright.app/Contents/Resources/uvcctl
          bash -n scripts/get.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unsigned
          path: dist/*

  # Signs the app with the stable "WebcamBright Release Signing" certificate. It keeps the designated
  # requirement the same from release to release, so macOS keeps the camera permission when the app
  # updates itself. This job builds and runs no project code: it only holds the key while codesign
  # runs, and the key is imported non-extractable.
  sign:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/WebcamBright.entitlements
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned
          path: dist
      - name: Import the code signing identity
        env:
          P12: ${{ secrets.WEBCAMBRIGHT_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.WEBCAMBRIGHT_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$P12" && test -n "$P12_PASSWORD" || { echo "WEBCAMBRIGHT_SIGNING_P12(_PASSWORD) secrets are missing" >&2; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -x -T /usr/bin/codesign >/dev/null
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S codesign: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
      - name: Sign
        run: |
          cd dist
          ditto -x -k WebcamBright-macos-arm64.zip unpacked
          app=unpacked/WebcamBright.app
          codesign --force --options runtime --sign "WebcamBright Release Signing" "$app/Contents/Resources/uvcctl"
          codesign --force --options runtime --entitlements ../app/WebcamBright.entitlements --sign "WebcamBright Release Signing" "$app"
          codesign --verify --deep --strict "$app"
          codesign -dr - "$app" 2>&1 | grep -q 'certificate leaf' \
            || { echo "WebcamBright.app is not signed with the release identity" >&2; exit 1; }
          rm WebcamBright-macos-arm64.zip SHA256SUMS
          ditto -c -k --sequesterRsrc --keepParent "$app" WebcamBright-macos-arm64.zip
          rm -rf unpacked
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*

  publish:
    needs: sign
    # macOS, for CryptoKit: scripts/sign-update.swift signs the checksums.
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      # Lets anyone check that the download was built here, from this repository:
      # gh attestation verify WebcamBright-macos-arm64.zip --repo estevecastells/webcam-bright
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/WebcamBright-macos-arm64.zip
      - name: Checksums and update signature
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd dist
          shasum -a 256 WebcamBright-macos-arm64.zip > SHA256SUMS
          swiftc -O -o "$RUNNER_TEMP/sign-update" ../scripts/sign-update.swift
          "$RUNNER_TEMP/sign-update" SHA256SUMS > SHA256SUMS.sig
          # The in-app updater refuses unsigned releases, so never publish one.
          test -s SHA256SUMS.sig
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat > NOTES.md <<'NOTES'
          ## Install (Apple silicon, macOS 14 or later)

          ```sh
          curl -fsSL https://raw.githubusercontent.com/estevecastells/webcam-bright/main/scripts/get.sh | bash
          ```

          Or download `WebcamBright-macos-arm64.zip`, unzip it and move **WebcamBright.app** to Applications.
          The app is signed but not notarized: if macOS refuses to open it, go to
          **System Settings → Privacy & Security** and click **Open Anyway**.

          The first time a call turns the camera on, allow WebcamBright to use the camera. Once installed,
          WebcamBright updates itself, never during a call.
          NOTES
          gh release create "$TAG" WebcamBright-macos-arm64.zip SHA256SUMS SHA256SUMS.sig \
            --title "WebcamBright $TAG" --notes-file NOTES.md --generate-notes --verify-tag
